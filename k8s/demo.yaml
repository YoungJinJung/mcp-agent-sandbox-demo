apiVersion: v1
kind: Namespace
metadata:
  name: mcp-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: mcp-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-server
  namespace: mcp-demo
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server
  namespace: mcp-demo
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: mcp-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: mcp-agent-sandbox-demo:local
          imagePullPolicy: Never
          env:
            - name: K8S_SANDBOX_CONNECTION__TYPE
              value: in-cluster
            - name: K8S_SANDBOX_CONNECTION__USE_POD_IP
              value: "true"
            - name: K8S_SANDBOX_CONNECTION__SERVER_PORT
              value: "8888"
            - name: K8S_SANDBOX_PROBE_NAMESPACE
              value: mcp-demo
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: mcp-demo
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-demo
  namespace: mcp-demo
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app: python-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: mcp-agent-sandbox-demo:local
          imagePullPolicy: Never
          command: [uvicorn, runtime:app, --host, 0.0.0.0, --port, "8888"]
          env:
            - name: SANDBOX_BASE_DIR
              value: /workspace
            - name: SANDBOX_EXEC_TIMEOUT_SECONDS
              value: "30"
          ports:
            - containerPort: 8888
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            periodSeconds: 2
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-demo
  namespace: mcp-demo
spec:
  replicas: 1
  sandboxTemplateRef:
    name: python-demo
